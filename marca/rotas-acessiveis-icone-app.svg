<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rotas Acessíveis">
  <title>Rotas Acessíveis — ícone de app</title>
  <defs>
    <linearGradient id="rai-fundo" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="rai-turquesa" x1="60" y1="200" x2="200" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#rai-fundo)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#22304f" stroke-width="3"/>

  <!-- símbolo simplificado: sem marcas cardeais, traços mais grossos para ler pequeno -->
  <g transform="translate(128 128) scale(0.72) translate(-128 -128)">
    <circle cx="128" cy="128" r="96" fill="none" stroke="#2dd4bf" stroke-width="16" opacity="0.9"/>
    <path d="M74 182C74 182 96 150 124 140S176 104 186 72"
          fill="none" stroke="url(#rai-turquesa)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M156 72l32-4 -4 32" fill="none" stroke="#22d3ee" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="74" cy="182" r="22" fill="#070b16"/>
    <circle cx="74" cy="182" r="22" fill="none" stroke="#5eead4" stroke-width="14"/>
  </g>
</svg>
